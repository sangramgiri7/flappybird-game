<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flame Flap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#DCE6F2;--ink:#14213D;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--ink:#E7EEF7}}
:root[data-theme="dark"]{--bg:#0B1220;--ink:#E7EEF7}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body{background:var(--bg);color:var(--ink);display:grid;place-items:center;font-family:Fredoka,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
canvas{display:block;width:min(100vw,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * .5625));aspect-ratio:9/16;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:16px;cursor:pointer}
canvas:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<h1 class="sr">Flame Flap: tap or press Space to fly the fire bird through the pipes</h1>
<canvas id="c" width="360" height="640" tabindex="0" aria-label="Flame Flap game"></canvas>
<script>
(function(){
var cv=document.getElementById("c"),ctx=cv.getContext("2d",{alpha:false}),W=360,H=640,GH=70,GAP=150,PW=58,BX=96,BR=12;
var dpr=Math.min(window.devicePixelRatio||1,1);cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
var reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
var KEY="flameflap:v1",save={best:0,plays:0,far:0,bird:0,arena:0};
try{Object.assign(save,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}

var WX=[
{n:"Clear skies",s:["#3AA8F0","#BDE8FF"],c:"#FFFFFF",h:"#7CC47A",h2:"#5BAA6A",g:"#D9C27A",gt:"#6BBF4A",p:"#4CAF50"},
{n:"Golden sunset",s:["#6C4BA0","#FFB27A"],c:"#FFD9C2",h:"#B2607A",h2:"#8A4A7A",g:"#C98F5B",gt:"#A8803F",p:"#2F9E78"},
{n:"Rain",s:["#46586A","#93A8B6"],c:"#6E7C89",h:"#4E7A6A",h2:"#3E665C",g:"#8E8A78",gt:"#4E8A5A",p:"#3E8E6B"},
{n:"Snow",s:["#8FA8BF","#EAF2F8"],c:"#FFFFFF",h:"#DDE8F0",h2:"#C3D3E0",g:"#F4F8FB",gt:"#CFE3F0",p:"#6FB6C9"},
{n:"Thunderstorm",s:["#090D22","#2B3160"],c:"#3A4260",h:"#1B2A3E",h2:"#142235",g:"#2B2F40",gt:"#1F5C48",p:"#2D7A63"}
];
var PER=600,FADE=120,pc={};
function rgb(h){if(!pc[h])pc[h]=[1,3,5].map(function(i){return parseInt(h.substr(i,2),16)});return pc[h]}
function mix(a,b,t){var x=rgb(a),y=rgb(b);return"rgb("+x.map(function(v,i){return Math.round(v+(y[i]-v)*t)}).join(",")+")"}

var bird="🐦‍🔥";
ctx.font="30px sans-serif";
if(ctx.measureText(bird).width>ctx.measureText("🐦").width*1.5)bird="🐦";

function sprite(ch,px){var c=document.createElement("canvas");c.width=c.height=px;var x=c.getContext("2d");x.font=(px*.8)+"px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText(ch,px/2,px/2+px*.04);return c}
var B=[{ch:bird,n:"Fire bird"},{ch:"🕊️",n:"Dove"},{ch:"🦜",n:"Parrot"}],BS=B.map(function(o){return sprite(o.ch,96)}),fireS=sprite("🔥",128);
var mode="pick",wt=0,idx=0,tm=0,gx=0,score=0,newBest=false,overAt=0,toast="",toastT=0,flash=0,shake=0;
var b={y:H/2-40,vy:0,rot:0},pipes=[],trail=[];
var rain=[],snow=[],stars=[],clouds=[],fires=[];
var amt={rain:0,snow:0,stars:0,sun:1,moon:0,orbY:110};
var i;
for(i=0;i<70;i++)rain.push({x:Math.random()*W,y:Math.random()*H,v:9+Math.random()*5});
for(i=0;i<50;i++)snow.push({x:Math.random()*W,y:Math.random()*H,v:.6+Math.random()*1.2,r:1.5+Math.random()*2,p:Math.random()*6});
for(i=0;i<30;i++)stars.push({x:Math.random()*W,y:Math.random()*(H-200),r:.6+Math.random()*1.4,p:Math.random()*6});
for(i=0;i<5;i++)clouds.push({x:Math.random()*W,y:50+i*70+Math.random()*30,s:.8+Math.random()*.8,v:.15+Math.random()*.25});

function reset(){mode="ready";wt=0;idx=0;score=0;pipes=[];trail=[];b.y=H/2-40;b.vy=0;b.rot=0;newBest=false;toast="";}
function flap(){
  if(mode==="ready"){mode="play"}
  if(mode==="play"){b.vy=-7.3}
  else if(mode==="over"&&performance.now()-overAt>500){reset()}
}
function die(){
  mode="over";overAt=performance.now();b.vy=-4;shake=10;
  save.plays++;if(score>save.best){save.best=score;newBest=true}
  save.far=Math.max(save.far,Math.min(idx+1,5));
  persist();
}
var embers=[];
function burst(x,y){
  fires.push({x:x,y:y,l:1,p:Math.random()*6});
  var i,a,s;if(fires.length>3)fires.shift();if(embers.length>30)embers.splice(0,embers.length-30);
  for(i=0;i<3;i++){a=-Math.PI/2+(Math.random()-.5)*2.6;s=3+Math.random()*4;embers.push({t:0,x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,r:Math.random()*6,vr:(Math.random()-.5)*.4,s:24+Math.random()*18})}
  for(i=0;i<6;i++){a=Math.random()*6.283;s=2+Math.random()*6;embers.push({t:1,x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,l:1,s:2+Math.random()*3})}
}
cv.addEventListener("pointerdown",function(e){e.preventDefault();var r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  if(mode==="pick"){for(var j=0;j<3;j++){var bx=26+j*104;if(x>bx&&x<bx+96){if(y>230&&y<380){save.bird=j;persist();mode="ready";burst(x,y)}else if(y>446&&y<490){save.arena=j;persist()}}}return}
  if(mode==="ready"&&x>80&&x<280&&y>200&&y<238){mode="pick";return}
  burst(x,y);flap()});
window.addEventListener("keydown",function(e){if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();flap()}});

function update(dt){
  tm+=dt;
  var cur=WX[idx%5],speed=Math.min(2.3+score*.03,3.6);
  if(mode==="play"){
    wt+=dt;var ni=Math.floor(wt/PER);
    if(ni!==idx){idx=ni;toast=WX[idx%5].n;toastT=150}
  }
  var k=idx%5;
  var tg={rain:k===2?.75:k===4?1:0,snow:k===3?1:0,stars:k===4?1:0,sun:k<2?1:0,moon:k===4?1:0,orbY:k===1?200:110};
  for(var key in tg)amt[key]+=(tg[key]-amt[key])*.03*dt;
  if(mode!=="over")gx+=speed*dt;
  clouds.forEach(function(c){c.x-=c.v*dt;if(c.x<-90)c.x=W+60});
  rain.forEach(function(r){r.y+=r.v*dt;r.x-=2*dt;if(r.y>H){r.y=-10;r.x=Math.random()*(W+40)}});
  snow.forEach(function(s){s.y+=s.v*dt;s.x+=Math.sin(tm/40+s.p)*.5*dt;if(s.y>H){s.y=-6;s.x=Math.random()*W}});
  if(k===4&&mode!=="ready"&&!reduce&&Math.random()<.003*dt)flash=1;
  flash*=Math.pow(.92,dt);if(toastT>0)toastT-=dt;if(shake>0)shake-=dt;
  if(mode==="ready"||mode==="pick"){b.y=H/2-40+Math.sin(tm/14)*8;b.rot=0}
  else{
    b.vy=Math.min(b.vy+.42*dt,10);b.y+=b.vy*dt;
    b.rot=Math.max(-.5,Math.min(1.3,b.vy*.09));
    if(b.y<BR){b.y=BR;b.vy=0}
    if(b.y+BR>H-GH){b.y=H-GH-BR;if(mode==="play")die();b.vy=0}
  }
  if(Math.random()<.9*dt&&mode!=="over"&&mode!=="pick")trail.push({x:BX-8,y:b.y+3,vx:-speed-Math.random()*1.5,vy:(Math.random()-.5)*1.2,l:1});
  trail.forEach(function(p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=.045*dt});
  trail=trail.filter(function(p){return p.l>0});
  fires.forEach(function(f){f.l-=.03*dt;f.y-=1.1*dt;f.x+=Math.sin(tm/6+f.p)*.5*dt});
  fires=fires.filter(function(f){return f.l>0});
  embers.forEach(function(e){e.vy+=(e.t?.14:.12)*dt;e.vx*=.985;e.x+=e.vx*dt;e.y+=e.vy*dt;e.l-=(e.t?.03:.02)*dt;if(e.t===0)e.r+=e.vr*dt});
  embers=embers.filter(function(e){return e.l>0});
  if(mode==="play"||mode==="over"){
    if(mode==="play"){
      var last=pipes[pipes.length-1];
      if(!last||last.x<W-205)pipes.push({x:W+10,top:70+Math.random()*(H-GH-GAP-140),pass:false});
    }
    pipes.forEach(function(p){
      if(mode==="play")p.x-=speed*dt;
      if(mode==="play"){
        if(!p.pass&&p.x+PW<BX-BR){p.pass=true;score++}
        if(BX+BR-3>p.x&&BX-BR+3<p.x+PW&&(b.y-BR+3<p.top||b.y+BR-3>p.top+GAP))die();
      }
    });
    pipes=pipes.filter(function(p){return p.x>-PW-10});
  }
}

var CC={};function col(key){return CC[key]||(CC[key]=col0(key))}function col0(key){
  var pr=WX[idx>0?(idx-1)%5:0],cu=WX[idx%5],t=Math.min(1,(wt%PER)/FADE);
  if(idx===0)t=1;
  return mix(pr[key],cu[key],t);
}
function skyc(j){
  var pr=WX[idx>0?(idx-1)%5:0],cu=WX[idx%5],t=idx===0?1:Math.min(1,(wt%PER)/FADE);
  return mix(pr.s[j],cu.s[j],t);
}
function hills(base,amp,f,par,color){
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,H);
  for(var x=0;x<=W;x+=8)ctx.lineTo(x,base+Math.sin((x+gx*par)*f)*amp+Math.sin((x+gx*par)*f*2.3)*amp*.4);
  ctx.lineTo(W,H);ctx.fill();
}
function txt(s,x,y,size,fill,stroke){
  ctx.font="700 "+size+"px Fredoka,system-ui,sans-serif";ctx.textAlign="center";ctx.lineJoin="round";
  if(stroke){ctx.lineWidth=size/6;ctx.strokeStyle=stroke;ctx.strokeText(s,x,y)}
  ctx.fillStyle=fill;ctx.fillText(s,x,y);
}
function pipe(x,top){
  var c=col("p");
  [[0,top,true],[top+GAP,H-GH-top-GAP,false]].forEach(function(s){
    var y=s[0],h=s[1];
    ctx.fillStyle=c;ctx.fillRect(x,y,PW,h);
    ctx.fillStyle="rgba(255,255,255,.22)";ctx.fillRect(x+8,y,8,h);
    ctx.fillStyle="rgba(0,0,0,.2)";ctx.fillRect(x+PW-14,y,14,h);
    var cy=s[2]?y+h-24:y;
    ctx.fillStyle=c;ctx.fillRect(x-4,cy,PW+8,24);
    ctx.fillStyle="rgba(255,255,255,.22)";ctx.fillRect(x+4,cy,8,24);
    ctx.fillStyle="rgba(0,0,0,.2)";ctx.fillRect(x+PW-10,cy,14,24);
    ctx.strokeStyle="rgba(0,0,0,.35)";ctx.lineWidth=2;ctx.strokeRect(x-4,cy,PW+8,24);
  });
}
var GR=["#3FA34D","#4C8A4A","#3A7D4F","#E8F1F6","#1F5C3A"],ST=["#7A8794","#6A5A6A","#5A6670","#9FB0BF","#1A2033"];
function acol(arr){var t=idx===0?1:Math.min(1,(wt%PER)/FADE);return mix(arr[idx>0?(idx-1)%5:0],arr[idx%5],t)}
var tile=document.createElement("canvas");tile.width=120;tile.height=110;
(function(){var x=tile.getContext("2d"),cs=["#E63946","#FFD23F","#3A86FF","#FFFFFF","#FF8FA3","#2EC4B6"];
  for(var r=0;r<7;r++)for(var c=0;c<15;c++){x.fillStyle=cs[(r*7+c*3+((r*c)%4))%6];x.globalAlpha=.85;x.beginPath();x.arc(4+c*8+(r%2)*3,18+r*14,3,0,6.3);x.fill()}
})();
var strip=document.createElement("canvas");strip.width=600;strip.height=110;(function(){var q=strip.getContext("2d");q.globalAlpha=.9;for(var i=0;i<5;i++)q.drawImage(tile,i*120,0)})();
function drawArena(){
  var by=H-GH,k=save.arena,x,s;
  ctx.fillStyle=acol(ST);ctx.fillRect(0,by-110,W,110);
  ctx.drawImage(strip,-(gx*.3)%120,by-110);
  ctx.fillStyle="rgba(0,0,0,.35)";ctx.fillRect(0,by-110,W,8);
  ctx.fillStyle="rgba(0,0,0,.25)";ctx.fillRect(0,by-14,W,14);
  if(k===2){for(x=-((gx*.6)%60);x<W;x+=60){ctx.fillStyle=(Math.round((x+gx*.6)/60)%2)?"#1D4ED8":"#E11D48";ctx.fillRect(x,by-14,56,14)}}
  else{ctx.fillStyle="rgba(255,255,255,.9)";for(x=-((gx*.6)%24);x<W;x+=24)ctx.fillRect(x,by-6,14,3)}
  for(x=-((gx*.5)%260)+60;x<W+40;x+=260){ctx.fillStyle="#2B3440";ctx.fillRect(x-2,by-200,4,92);ctx.fillRect(x-16,by-214,32,16);ctx.fillStyle="rgba(255,244,190,"+(.4+.6*amt.stars)+")";ctx.fillRect(x-14,by-212,28,12)}
  if(k===2){ctx.fillStyle="#FFFFFF";for(x=-(gx%640)+300;x<W+40;x+=640){ctx.fillRect(x,by-70,5,70);ctx.fillRect(x+60,by-70,5,70);ctx.fillRect(x,by-70,65,5)}}
  else{ctx.fillStyle="#F5E9C8";for(x=-(gx%340)+40;x<W+130;x+=340){[x+6,x+112].forEach(function(sx){for(s=0;s<3;s++)ctx.fillRect(sx+s*5-5,by-26,3,26);ctx.fillRect(sx-5,by-27,13,2)})}}
}
function drawGround(){
  var by=H-GH,k=save.arena,x;
  ctx.fillStyle="rgba(0,0,0,.1)";for(x=-(gx%64);x<W;x+=64)ctx.fillRect(x,by,32,GH);
  if(k===2){ctx.fillStyle="rgba(255,255,255,.85)";ctx.fillRect(0,by+5,W,3);for(x=-(gx%300)+80;x<W;x+=300)ctx.fillRect(x,by+5,3,GH-5)}
  else{for(x=-(gx%340)+40;x<W+130;x+=340){ctx.fillStyle="#CDB27A";ctx.fillRect(x,by,120,GH);ctx.fillStyle="rgba(0,0,0,.1)";ctx.fillRect(x,by,120,4)}}
  if(amt.stars>.02){ctx.fillStyle="rgba(0,0,0,"+amt.stars*.35+")";ctx.fillRect(0,by,W,GH)}
}
function drawPick(){
  if(mode!=="pick")return;
  txt("Choose your bird",W/2,150,38,"#FFD23F","#7A1F00");
  for(var j=0;j<3;j++){var x=26+j*104,sel=(save.bird||0)===j;
    ctx.fillStyle="rgba(10,14,30,.6)";ctx.beginPath();ctx.roundRect(x,230,96,150,16);ctx.fill();
    if(sel){ctx.strokeStyle="#FFD23F";ctx.lineWidth=3;ctx.stroke()}
    ctx.drawImage(BS[j],x+16,252,64,64);
    txt(B[j].n,x+48,352,16,"#fff");
  }
  txt("Arena",W/2,432,18,"#fff","rgba(0,0,0,.5)");
  for(var k=0;k<3;k++){var ax=26+k*104,on=(save.arena||0)===k;ctx.fillStyle=on?"#FFD23F":"rgba(10,14,30,.6)";ctx.beginPath();ctx.roundRect(ax,446,96,44,22);ctx.fill();txt(["Sky","Cricket","Football"][k],ax+48,475,17,on?"#2A1400":"#fff")}
  txt("Tap a bird to start",W/2,530,22,"#fff","rgba(0,0,0,.5)");
}
function drawFx(){
  ctx.save();
  fires.forEach(function(f){var u=1-f.l,r=30+u*110,g="rgba(255,150,40,"+f.l*.1+")";
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,r,0,6.3);ctx.fill();
    ctx.strokeStyle="rgba(255,220,120,"+f.l*.18+")";ctx.lineWidth=2+f.l*5;ctx.beginPath();ctx.arc(f.x,f.y,10+u*90,0,6.3);ctx.stroke()});
  embers.forEach(function(e){if(e.t===1){ctx.globalAlpha=e.l*.35;ctx.fillStyle=e.l>.5?"#FFE27A":"#FF6A1A";ctx.beginPath();ctx.arc(e.x,e.y,e.s*e.l+.5,0,6.3);ctx.fill()}});
  ctx.restore();
  embers.forEach(function(e){if(e.t===0){ctx.save();ctx.globalAlpha=Math.min(.2,e.l*.35);ctx.translate(e.x,e.y);ctx.rotate(e.r);var z=e.s*(.5+e.l*.7)*1.3;ctx.drawImage(fireS,-z/2,-z/2,z,z);ctx.restore()}});
}
function draw(){CC={};
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  var g=ctx.createLinearGradient(0,0,0,H-GH);g.addColorStop(0,skyc(0));g.addColorStop(1,skyc(1));
  ctx.fillStyle=g;ctx.fillRect(-10,-10,W+20,H+20);
  stars.forEach(function(s){ctx.globalAlpha=amt.stars*(.5+.5*Math.sin(tm/20+s.p));ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.3);ctx.fill()});
  ctx.globalAlpha=amt.sun;ctx.fillStyle=idx%5===1?"#FFE2B8":"#FFF4B0";ctx.beginPath();ctx.arc(270,amt.orbY,34,0,6.3);ctx.fill();
  ctx.globalAlpha=amt.moon;ctx.fillStyle="#E8ECFF";ctx.beginPath();ctx.arc(270,110,26,0,6.3);ctx.fill();
  ctx.globalAlpha=1;
  var cc=col("c");ctx.fillStyle=cc;
  clouds.forEach(function(c){ctx.beginPath();ctx.ellipse(c.x,c.y,38*c.s,14*c.s,0,0,6.3);ctx.ellipse(c.x-22*c.s,c.y+4*c.s,24*c.s,11*c.s,0,0,6.3);ctx.ellipse(c.x+24*c.s,c.y+3*c.s,26*c.s,12*c.s,0,0,6.3);ctx.fill()});
  if(save.arena)drawArena();else{hills(H-GH-70,30,.011,.2,col("h2"));hills(H-GH-35,20,.019,.5,col("h"))}
  pipes.forEach(function(p){pipe(p.x,p.top)});
  ctx.fillStyle=save.arena?acol(GR):col("g");ctx.fillRect(0,H-GH,W,GH);
  if(save.arena)drawGround();else{ctx.fillStyle=col("gt");ctx.fillRect(0,H-GH,W,14)}
  ctx.fillStyle="rgba(0,0,0,.12)";if(!save.arena)for(var x=-(gx%24);x<W;x+=24)ctx.fillRect(x,H-GH+14,12,6);
  trail.forEach(function(p){ctx.globalAlpha=p.l*.8;ctx.fillStyle=p.l>.55?"#FFD23F":"#FF5A1F";ctx.beginPath();ctx.arc(p.x,p.y,2+p.l*5,0,6.3);ctx.fill()});
  ctx.globalAlpha=1;
  ctx.save();ctx.translate(BX,b.y);ctx.rotate(b.rot);ctx.scale(-1,1);
  ctx.font="34px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  if(mode!=="pick")ctx.drawImage(BS[save.bird||0],-21,-19,42,42);ctx.restore();ctx.textBaseline="alphabetic";
  if(amt.rain>.02){ctx.strokeStyle="rgba(200,220,255,.55)";ctx.lineWidth=1.4;ctx.beginPath();
    rain.forEach(function(r,j){if(j<rain.length*amt.rain){ctx.moveTo(r.x,r.y);ctx.lineTo(r.x+2,r.y-11)}});ctx.stroke()}
  if(amt.snow>.02){ctx.fillStyle="rgba(255,255,255,.9)";
    snow.forEach(function(s,j){if(j<snow.length*amt.snow){ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.3);ctx.fill()}})}
  if(flash>.02){ctx.fillStyle="rgba(255,255,255,"+flash*.7+")";ctx.fillRect(0,0,W,H)}
  ctx.restore();
  drawFx();fires.forEach(function(f){ctx.globalAlpha=Math.min(.15,f.l*.3);var z=(80+Math.sin((1-f.l)*3.1)*40)*1.25;ctx.drawImage(fireS,f.x-z/2,f.y-z/2,z,z)});
  ctx.globalAlpha=1;ctx.textBaseline="alphabetic";
  drawPick();if(mode==="play"||mode==="over"){txt(String(score),W/2,90,56,"#fff","rgba(0,0,0,.55)")}
  if(toastT>0){ctx.globalAlpha=Math.min(1,toastT/40);txt(toast,W/2,140,26,"#fff","rgba(0,0,0,.55)");ctx.globalAlpha=1}
  if(mode==="ready"){
    txt("Flame Flap",W/2,170,52,"#FFD23F","#7A1F00");
    ctx.fillStyle="rgba(10,14,30,.55)";ctx.beginPath();ctx.roundRect(80,200,200,38,19);ctx.fill();txt("Change bird or arena",W/2,226,18,"#fff");
    txt("Tap or press Space to fly",W/2,H-GH-120,22,"#fff","rgba(0,0,0,.55)");
    txt("Best "+save.best+"   Games "+save.plays,W/2,H-GH+44,20,"#fff","rgba(0,0,0,.5)");
    if(save.far>0)txt("Furthest: "+WX[save.far-1].n,W/2,H-GH+68,16,"#fff","rgba(0,0,0,.5)");
  }
  if(mode==="over"&&performance.now()-overAt>350){
    ctx.fillStyle="rgba(10,14,30,.78)";ctx.beginPath();ctx.roundRect(50,200,W-100,230,20);ctx.fill();
    txt("Game over",W/2,252,36,"#fff");
    txt("Score "+score,W/2,296,26,"#FFD23F");
    txt(newBest?"New best!":"Best "+save.best,W/2,332,22,newBest?"#7CFFB2":"#cfd8ff");
    txt("Reached: "+WX[idx%5].n,W/2,366,18,"#cfd8ff");
    txt("Tap to play again",W/2,408,20,"#fff");
  }
}
var lastT=performance.now();
function frame(now){requestAnimationFrame(frame);if(now-lastT<15)return;var dt=Math.min(2.5,(now-lastT)/16.667);lastT=now;update(dt);draw()}
document.fonts&&document.fonts.load("700 20px Fredoka");
requestAnimationFrame(frame);
})();
</script>
